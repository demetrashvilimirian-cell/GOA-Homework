<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- #1 -->
    <!-- Radio არის რამოდენიმე პასუხებიდან ერთი ვარიანტის არჩევა. -->
    <!-- Checkbox - ი არის ოთხკუთხედი მოსანიშნი ადგილი. -->
    <!-- #2 -->
    <!-- label - ი გამოიყენება ინფუთის სახელის დარქმევისთვის და დაკავშირებისთვის, როცა label - ის ტექსტს დააწვები და ინფუთს დააკავშირებ, გადაგიყვანს იმ შესაყვანზე, მაგალითად: -->
    <label>Example
        <input type="text" placeholder="example" name="example" required>
    </label>
    <!-- #3 -->
    <!-- required იმისთვის გამოიყენება თუ ველი ცარიელია, ინფორმაცია არ გაიგზავნება. -->
    <!-- #4 -->
    <!-- name ატრიბუტი გადასცემს სერვერს მონაცემის სახელს -->
    <!-- და value ატრიბუტი ამატებს უკვე დაწერილ ნებისმიერ სიმბოლოს/ტექსტს ინფუთში. -->
</body>
</html>
