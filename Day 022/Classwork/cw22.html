<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22</title>
</head>
<body>
    <h1><em>Registration Form</em></h1>
    <form>
      <label>Enter Your Name:
        <input type="text" placeholder="Enter Your Name" name="name" required>
    </label>
    <br>
    <label>Enter Your Last Name:
        <input type="text" placeholder="Enter Your Last Name" name="lastname" required>
    </label>
    <br>
    <label>Enter Your Email:
        <input type="email" placeholder="Enter Your Email" name="email" required>
    </label>
    <br>
    <label>Enter Your Password:
        <input type="password" placeholder="Enter Your Password" name="password" required>
    </label>
    <br>
    <label>Gender:</label><br>
    <label>Male
        <input type="radio" name="male" value="male" required>
    </label><br>
    <label>Female
        <input type="radio" name="female" value="female" required>
    </label><br>
    <label>Other
        <input type="radio" name="other" value="other" required>
    </label><br>
    <label>Age:
        <input type="number" name="age" value="age" required>
    </label>

    
    </form>
    
    
</body>
</html>
